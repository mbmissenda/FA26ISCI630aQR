<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Questions Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2733;
    --ink-soft: #4a5866;
    --paper: #f6f7f5;
    --panel: #ffffff;
    --line: #d9dfe3;
    --ask: #e8eef4;        /* student question */
    --ask-edge: #5b7a99;
    --reply: #ffffff;      /* faculty answer */
    --reply-edge: #1f6f78;
    --accent: #1f6f78;
    --accent-ink: #ffffff;
    --new: #a4471f;
    --new-bg: #fbe9df;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e8edf1; --ink-soft: #aab6c1; --paper: #141b22; --panel: #1b252e;
      --line: #2d3a46; --ask: #22303d; --ask-edge: #7f9db9; --reply: #1b252e;
      --reply-edge: #4fb0ba; --accent: #4fb0ba; --accent-ink: #0d1a1c;
      --new: #f0a986; --new-bg: #3a2519;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 1.0625rem; line-height: 1.6;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 64px; }

  header h1 {
    font-family: var(--serif); font-weight: 600; font-size: clamp(1.9rem, 4vw, 2.6rem);
    line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.01em;
  }
  header p { margin: 0; max-width: 62ch; color: var(--ink-soft); }

  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 28px 0 24px; }
  .search { flex: 1 1 260px; position: relative; }
  .search input {
    width: 100%; font: inherit; color: var(--ink); background: var(--panel);
    border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 14px;
  }
  .search input::placeholder { color: var(--ink-soft); }
  .stat { color: var(--ink-soft); font-size: 0.95rem; }

  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 36px; align-items: start; }

  nav.modules { position: sticky; top: 16px; }
  nav.modules h2 { font-size: 1rem; margin: 0 0 10px; color: var(--ink-soft); font-weight: 700; }
  nav.modules ul { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
  nav.modules button {
    display: flex; width: 100%; justify-content: space-between; gap: 10px; text-align: left;
    font: inherit; color: var(--ink); background: none; border: 0; cursor: pointer;
    padding: 9px 12px; margin-left: -2px; border-left: 4px solid transparent; border-radius: 0 6px 6px 0;
  }
  nav.modules button:hover { background: var(--ask); }
  nav.modules button[aria-current="true"] {
    border-left-color: var(--accent); background: var(--ask); font-weight: 700;
  }
  .count {
    flex: none; min-width: 1.7em; text-align: center; font-size: 0.85rem; font-weight: 700;
    background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px;
  }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--new); margin-left:6px; vertical-align: middle; }

  section.module { margin-bottom: 44px; }
  section.module > h2 {
    font-family: var(--serif); font-weight: 600; font-size: 1.6rem; line-height: 1.25;
    margin: 0 0 4px;
  }
  .module-sub { color: var(--ink-soft); margin: 0 0 18px; font-size: 0.95rem; }

  article.qa { margin: 0 0 22px; }
  .ask, .reply { position: relative; padding: 14px 18px; border-radius: 10px; }
  .ask {
    background: var(--ask); border-left: 5px solid var(--ask-edge);
    margin-right: 8%;
  }
  .reply {
    background: var(--reply); border: 1.5px solid var(--line); border-left: 5px solid var(--reply-edge);
    margin: 8px 0 0 8%;
  }
  .who { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.92rem; margin-bottom: 4px; color: var(--ink-soft); }
  .reply .who { color: var(--accent); }
  .ask p.text { font-family: var(--serif); font-size: 1.2rem; line-height: 1.4; margin: 0; }
  .reply .text { margin: 0; }
  .reply .text p { margin: 0 0 0.7em; max-width: 68ch; }
  .reply .text p:last-child { margin-bottom: 0; }
  .badge {
    font-size: 0.8rem; font-weight: 700; color: var(--new); background: var(--new-bg);
    border-radius: 99px; padding: 1px 10px;
  }
  .date { margin-left: auto; font-weight: 400; }
  .modtag { font-weight: 400; }

  .empty { padding: 28px; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--ink-soft); }
  .notice { background: var(--new-bg); color: var(--ink); border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; font-size: 0.95rem; }

  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; gap: 20px; }
    nav.modules { position: static; }
    nav.modules ul { display: flex; overflow-x: auto; border-left: 0; border-bottom: 2px solid var(--line); gap: 4px; padding-bottom: 6px; }
    nav.modules button { border-left: 0; border-bottom: 4px solid transparent; border-radius: 6px 6px 0 0; white-space: nowrap; margin-left: 0; width: auto; }
    nav.modules button[aria-current="true"] { border-bottom-color: var(--accent); }
    .ask { margin-right: 0; } .reply { margin-left: 16px; }
  }
  @media print {
    nav.modules, .toolbar { display: none; }
    .layout { display: block; }
    article.qa { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="page-title"></h1>
    <p id="page-sub"></p>
  </header>

  <div class="toolbar">
    <div class="search">
      <label for="q" class="sr" style="position:absolute;left:-9999px">Search questions and answers</label>
      <input id="q" type="search" placeholder="Search all questions and answers" autocomplete="off">
    </div>
    <div class="stat" id="stat" aria-live="polite"></div>
  </div>

  <div class="layout">
    <nav class="modules" aria-label="Modules">
      <h2>Modules</h2>
      <ul id="module-list"></ul>
    </nav>
    <main id="content" tabindex="-1"></main>
  </div>
</div>

<script>
/* ============================================================
   EDIT THIS BLOCK. Everything below it can stay as is.
   ============================================================ */
const CONFIG = {
  title: "Your questions, answered",
  subtitle: "Anonymous questions from this course, grouped by module. New answers are added each week and everything stays here as an archive.",

  // Days an entry keeps its "New" badge
  newDays: 7,

  // Optional. Paste the "Publish to web > CSV" link of your Google Sheet here.
  // The sheet needs these column headers: Module, Date, Question, Answer, Publish
  // Works when this page is hosted on your own site (for example GitHub Pages).
  // Leave empty to use the ENTRIES list below.
  sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS6mWIsEAZX9OUDpobzvTDcFOfRUIAdQL1obWR9FhOTKrrExfayB7xABNaP9-C_A5-2J3kATtbO7Juq/pub?output=csv",

  // Module order and names. "id" is what you type in the Module column.
  modules: [
    { id: 1, title: "Module 1: Foundations of complementary health" },
    { id: 2, title: "Module 2: Mind-body approaches" },
    { id: 3, title: "Module 3: Herbs and dietary supplements" },
    { id: 4, title: "Module 4: Traditional healing systems" },
    { id: 5, title: "Module 5: Manual and body-based therapies" },
    { id: 6, title: "Module 6: Energy and biofield approaches" }
  ]
};

// SAMPLE ENTRIES. Replace with your own. Date format: YYYY-MM-DD.
// Use a blank line in an answer (\n\n) to start a new paragraph.
const ENTRIES = [
  { module: 1, date: "2026-09-08",
    question: "What is the difference between complementary, alternative, and integrative health?",
    answer: "Complementary means used together with conventional care. Alternative means used in place of it. Integrative describes coordinated, whole-person care that brings the two together, usually with attention to evidence and safety.\n\nMost people who use these approaches use them as complements." },
  { module: 1, date: "2026-09-08",
    question: "If a supplement or therapy isn't proven, why do so many people still use it?",
    answer: "Reasons include cultural tradition, dissatisfaction with conventional options, wanting more control over their own care, and real benefit that some people notice. A useful habit for this course is to ask what the evidence says, and also what the person is hoping the approach will do for them." },
  { module: 2, date: "2026-09-10",
    question: "Is meditation the same thing as mindfulness?",
    answer: "Mindfulness is one kind of meditation practice, built around paying attention to the present moment without judging it. Meditation is the broader family and also includes practices like focused-attention, loving-kindness, and mantra-based meditation." },
  { module: 3, date: "2026-09-12",
    question: "Are dietary supplements regulated the way medications are?",
    answer: "No. Under the Dietary Supplement Health and Education Act of 1994, supplements do not need FDA approval before they are sold. Manufacturers are responsible for safety and labeling, and the FDA generally acts after a product is on the market and a problem appears.\n\nThis is why third-party testing seals and a pharmacist's review of a product matter." },
  { module: 3, date: "2026-09-17",
    question: "Can St. John's wort interfere with other medicines?",
    answer: "Yes, and it is one of the best-known herb-drug interactions. It can speed up how the body clears many medications, including some hormonal contraceptives, certain antidepressants, and some transplant and HIV drugs, making them less effective.\n\nAnyone taking it alongside prescription medicine should check with a pharmacist or prescriber first." },
  { module: 4, date: "2026-09-15",
    question: "Do traditional systems like Ayurveda and Traditional Chinese Medicine have to be 'proven' by Western research to be valid?",
    answer: "This is a live debate. Western trial methods can test specific interventions, such as acupuncture for chronic pain. They are less suited to testing a whole system that individualizes treatment. We will come back to this when we discuss how to judge evidence across different frameworks." },
  { module: 5, date: "2026-09-16",
    question: "What's the difference between acupuncture and dry needling?",
    answer: "Both insert thin needles. Acupuncture comes from a traditional Chinese framework of points and meridians. Dry needling, as practiced by many physical therapists, targets myofascial trigger points using Western anatomy. The techniques overlap, but training, theory, and scope of practice differ, and they vary by state." },
  { module: 6, date: "2026-09-18",
    question: "Does Reiki have any scientific support?",
    answer: "Some small studies report reduced stress, anxiety, or pain, but the studies are often small and the results are mixed. No mechanism involving an energy field has been demonstrated. Researchers note that relaxation, attention, and expectation may explain much of the benefit people report.\n\nWe will look at how to read a study like this in class." }
];
/* ============================================================
   END OF EDIT BLOCK
   ============================================================ */

(function () {
  const state = { module: "all", query: "", entries: [] };
  const $ = (id) => document.getElementById(id);

  document.title = CONFIG.title;
  $("page-title").textContent = CONFIG.title;
  $("page-sub").textContent = CONFIG.subtitle;

  function parseCSV(text) {
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); cur = ""; rows.push(row); row = [];
      } else cur += c;
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  function fromCSV(text) {
    const rows = parseCSV(text).filter(r => r.some(c => c.trim()));
    const head = rows.shift().map(h => h.trim().toLowerCase());
    const idx = (n) => head.indexOf(n);
    return rows.map(r => ({
      module: parseInt(r[idx("module")], 10),
      date: (r[idx("date")] || "").trim(),
      question: (r[idx("question")] || "").trim(),
      answer: (r[idx("answer")] || "").trim(),
      publish: (r[idx("publish")] || "y").trim().toLowerCase()
    })).filter(e => e.question && e.answer && e.publish.startsWith("y"));
  }

  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    const d = new Date(s); return isNaN(d) ? null : d;
  }
  function fmtDate(d) { return d ? d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }) : ""; }
  function isNew(d) { return d && (Date.now() - d.getTime()) / 86400000 <= CONFIG.newDays; }

  function prepare(list) {
    return list.map(e => Object.assign({}, e, { d: parseDate(e.date) }))
      .sort((a, b) => (b.d ? b.d.getTime() : 0) - (a.d ? a.d.getTime() : 0));
  }

  function visible() {
    const q = state.query.trim().toLowerCase();
    return state.entries.filter(e => {
      if (q) return (e.question + " " + e.answer).toLowerCase().includes(q);
      return state.module === "all" || e.module === state.module;
    });
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderNav() {
    const ul = $("module-list"); ul.innerHTML = "";
    const add = (id, label, count, hasNew) => {
      const li = document.createElement("li");
      const b = el("button"); b.type = "button";
      b.setAttribute("aria-current", String(!state.query && state.module === id));
      const span = el("span", null, label);
      if (hasNew) { const dot = el("span", "dot"); dot.title = "New answers"; dot.setAttribute("aria-label", "has new answers"); span.appendChild(dot); }
      b.appendChild(span); b.appendChild(el("span", "count", String(count)));
      b.addEventListener("click", () => { state.module = id; $("q").value = ""; state.query = ""; render(); $("content").focus({ preventScroll: true }); });
      li.appendChild(b); ul.appendChild(li);
    };
    add("all", "All modules", state.entries.length, state.entries.some(e => isNew(e.d)));
    CONFIG.modules.forEach(m => {
      const inMod = state.entries.filter(e => e.module === m.id);
      add(m.id, m.title, inMod.length, inMod.some(e => isNew(e.d)));
    });
  }

  function renderEntry(e, showModule) {
    const a = el("article", "qa");
    const ask = el("div", "ask");
    const who = el("div", "who");
    who.appendChild(el("span", null, "A student asked"));
    if (showModule) {
      const m = CONFIG.modules.find(x => x.id === e.module);
      if (m) who.appendChild(el("span", "modtag", "in " + m.title.split(":")[0]));
    }
    if (isNew(e.d)) who.appendChild(el("span", "badge", "New"));
    if (e.d) who.appendChild(el("span", "date", fmtDate(e.d)));
    ask.appendChild(who);
    ask.appendChild(el("p", "text", e.question));

    const reply = el("div", "reply");
    reply.appendChild(el("div", "who", "Instructor answer"));
    const body = el("div", "text");
    e.answer.split(/\n\s*\n|\\n\\n/).forEach(p => body.appendChild(el("p", null, p.trim())));
    reply.appendChild(body);
    a.appendChild(ask); a.appendChild(reply);
    return a;
  }

  function renderContent() {
    const box = $("content"); box.innerHTML = "";
    const list = visible();
    const q = state.query.trim();

    if (state.loadError) box.appendChild(el("div", "notice", state.loadError));

    if (q) {
      const s = el("section", "module");
      s.appendChild(el("h2", null, "Search results"));
      s.appendChild(el("p", "module-sub", list.length + (list.length === 1 ? " match" : " matches") + " for \u201c" + q + "\u201d"));
      list.forEach(e => s.appendChild(renderEntry(e, true)));
      if (!list.length) s.appendChild(el("div", "empty", "No questions match that search. Try a different word, or pick a module from the list."));
      box.appendChild(s);
    } else if (state.module === "all") {
      let any = false;
      CONFIG.modules.forEach(m => {
        const items = list.filter(e => e.module === m.id);
        if (!items.length) return;
        any = true;
        const s = el("section", "module");
        s.appendChild(el("h2", null, m.title));
        s.appendChild(el("p", "module-sub", items.length + (items.length === 1 ? " question" : " questions")));
        items.forEach(e => s.appendChild(renderEntry(e, false)));
        box.appendChild(s);
      });
      if (!any) box.appendChild(el("div", "empty", "No questions have been posted yet. Check back after the first module."));
    } else {
      const m = CONFIG.modules.find(x => x.id === state.module);
      const s = el("section", "module");
      s.appendChild(el("h2", null, m.title));
      s.appendChild(el("p", "module-sub", list.length + (list.length === 1 ? " question" : " questions")));
      list.forEach(e => s.appendChild(renderEntry(e, false)));
      if (!list.length) s.appendChild(el("div", "empty", "No questions have been posted for this module yet. Ask yours in the module and check back here."));
      box.appendChild(s);
    }
    const total = state.entries.length, newCount = state.entries.filter(e => isNew(e.d)).length;
    $("stat").textContent = total + " questions answered" + (newCount ? ", " + newCount + " new this week" : "");
  }

  function render() { renderNav(); renderContent(); }

  $("q").addEventListener("input", (ev) => { state.query = ev.target.value; render(); });

  async function init() {
    state.entries = prepare(ENTRIES);
    if (CONFIG.sheetCsvUrl) {
      try {
        const res = await fetch(CONFIG.sheetCsvUrl, { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        state.entries = prepare(fromCSV(await res.text()));
      } catch (err) {
        state.loadError = "The latest questions could not be loaded, so an earlier saved copy is showing.";
      }
    }
    render();
  }
  init();
})();
</script>
</body>
</html>
